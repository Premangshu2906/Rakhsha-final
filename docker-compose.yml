version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nhaa_ai_backend
    ports:
      - "8000:8000"
    environment:
      - AI_PROVIDER=deterministic
      - SECRET_KEY=sih-2026-nhaa-14566-super-secret-key
    volumes:
      - ./backend/nhaa_stress.db:/app/nhaa_stress.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nhaa_ai_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
