services:
  - type: web
    name: nhaa-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: AI_PROVIDER
        value: deterministic
      - key: SECRET_KEY
        generateValue: true
